syntax = "proto3";

package fenpo.v1;

option csharp_namespace = "Fenpo.Protocol.V1";
option java_package = "com.fenpo.protocol.v1";
option java_multiple_files = true;

import "google/protobuf/timestamp.proto";

// Now playing and media control (CAPABILITY_MEDIA). The iPhone's media reaches the PC through AMS;
// an Android phone reports its own media session with these messages. Either side may send
// MediaState about itself and MediaCommand to control the other.
//
// MediaState is sent after Hello and whenever the track, play state or volume changes. Position
// is not streamed: the receiver advances position_ms from position_at while playing.

message MediaState {
  bool active = 1;                       // false: nothing is playing or paused; other fields are empty.
  string app_id = 2;                     // Player, e.g. "com.spotify.music".
  string app_name = 3;
  string title = 4;
  string artist = 5;
  string album = 6;
  bool playing = 7;
  uint64 duration_ms = 8;                // 0 when unknown (live streams).
  uint64 position_ms = 9;
  google.protobuf.Timestamp position_at = 10;
  uint32 volume_percent = 11;            // Media volume of the sending device, 0-100.
  bool can_previous = 12;
  bool can_next = 13;
  bool can_seek = 14;
  bytes artwork_jpeg = 15;               // At most 300x300. Not sent on BLE; follows on Wi-Fi.
}

enum MediaAction {
  MEDIA_ACTION_UNSPECIFIED = 0;
  MEDIA_ACTION_PLAY = 1;
  MEDIA_ACTION_PAUSE = 2;
  MEDIA_ACTION_TOGGLE = 3;               // Play if paused, pause if playing.
  MEDIA_ACTION_NEXT = 4;
  MEDIA_ACTION_PREVIOUS = 5;
  MEDIA_ACTION_SEEK = 6;                 // To seek_to_ms.
  MEDIA_ACTION_SET_VOLUME = 7;           // To volume_percent.
}

// Control the other device's media. Answered with Error UNSUPPORTED when nothing can be controlled.
message MediaCommand {
  MediaAction action = 1;
  uint64 seek_to_ms = 2;
  uint32 volume_percent = 3;
}
