androidxTestExt = "1.3.0"
androidxTestCore = "1.7.0"
androidxTestRunner = "1.7.0"
robolectric = "4.17"
roborazzi = "1.76.0"
turbine = "1.2.1"
spotless = "8.10.4"
ktlint = "1.8.0"
composeRules = "0.6.8"

[libraries]
androidx-activity = { module = "androidx.activity:activity", version.ref = "activity" }
