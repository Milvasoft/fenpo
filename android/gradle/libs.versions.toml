coroutines = "1.11.0"
composeBom = "2026.09.00"
navigation3 = "1.2.0"
lifecycle = "2.11.0"
activity = "1.13.0"
appcompat = "1.8.0"
coreKtx = "1.19.1"
splashscreen = "1.2.0"
datastore = "1.2.1"
camerax = "1.6.2"
zxingCpp = "3.1.1"
