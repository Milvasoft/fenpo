<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fenpo iPhone Tasarımı</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gabarito:wght@700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --page-bg: #E9ECF4; --page-text: #1B1F3B; --page-muted: #5D6382; --page-line: #D5DAE7;
    --bloom: #E8577E; --tint: #D23E68; --leaf: #2F8F6B; --ink: #1B1F3B;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --page-bg: #11132A; --page-text: #EEF0F8; --page-muted: #A3A8C3; --page-line: #2C3152; }
  }
  :root[data-theme="dark"] { --page-bg: #11132A; --page-text: #EEF0F8; --page-muted: #A3A8C3; --page-line: #2C3152; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--page-bg); color: var(--page-text); font: 15px/1.5 Inter, system-ui, sans-serif; }
  .page-head { max-width: 1400px; margin: 0 auto; padding: 28px 24px 8px; }
  .page-head { display: flex; gap: 24px; align-items: flex-end; justify-content: space-between; flex-wrap: wrap; }
  .theme-btn { font: inherit; font-size: 14px; border: 1px solid var(--page-line); background: transparent; color: var(--page-text); padding: 8px 14px; border-radius: 8px; cursor: pointer; }
  .theme-btn:hover { border-color: var(--bloom); }
  .theme-btn:focus-visible { outline: 2px solid var(--bloom); outline-offset: 2px; }
  .page-head h1 { font-family: Gabarito, sans-serif; font-size: 34px; letter-spacing: -0.02em; margin: 0; line-height: 1; }
  .page-head p { margin: 6px 0 0; color: var(--page-muted); max-width: 70ch; }

  .gallery { max-width: 1400px; margin: 0 auto; padding: 24px; display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 40px 28px; }
  figure { margin: 0; }
  figcaption { margin-top: 14px; max-width: 40ch; }
  figcaption b { font-family: Gabarito, sans-serif; font-size: 19px; display: block; font-weight: 700; }
  figcaption span { color: var(--page-muted); font-size: 14px; }
  .scaler { width: 330px; height: calc(870px * 330 / 413); margin: 0 auto; }
  .scaler > .device { transform: scale(calc(330 / 413)); transform-origin: 0 0; }

  /* ---------- Device ---------- */
  .device { width: 413px; height: 870px; border-radius: 68px; padding: 10px; background: linear-gradient(145deg, #4A4F6A, #20233A 40%, #3A3F5A); box-shadow: 0 40px 70px -40px rgba(27,31,59,.6), inset 0 0 0 2px rgba(255,255,255,.12); }
  .screen {
    --bg: #F2F3F8; --card: #FFFFFF; --text: #1B1F3B; --text-2: #6B7090; --text-3: #9EA3BC; --sep: rgba(27,31,59,.09);
    --glass: rgba(255,255,255,.62); --glass-stroke: rgba(255,255,255,.75);
    width: 393px; height: 850px; border-radius: 58px; overflow: hidden; position: relative; background: var(--bg); color: var(--text);
    font-family: -apple-system, "SF Pro Text", Inter, system-ui, sans-serif; font-size: 15px; letter-spacing: -0.01em;
  }
  .screen.dark { --tint: #FF86A6; --ink-ic: #4A4F6A; --bg: #000; --card: #1C1C22; --text: #F4F5FA; --text-2: #A2A6BD; --text-3: #6D7190; --sep: rgba(255,255,255,.1); --glass: rgba(40,42,58,.55); --glass-stroke: rgba(255,255,255,.14); }
  .di { position: absolute; top: 11px; left: 50%; transform: translateX(-50%); width: 124px; height: 36px; border-radius: 20px; background: #000; z-index: 20; }
  .status { position: absolute; top: 0; left: 0; right: 0; height: 54px; display: flex; align-items: center; justify-content: space-between; padding: 6px 34px 0 46px; font-weight: 600; font-size: 16px; z-index: 19; }
  .status .r { display: flex; gap: 6px; align-items: center; }
  .sig { display: flex; gap: 2px; align-items: flex-end; height: 11px; }
  .sig i { width: 3px; border-radius: 1px; background: currentColor; display: block; }
  .bat { width: 25px; height: 12px; border-radius: 4px; border: 1.2px solid currentColor; opacity: .9; position: relative; padding: 1.5px; }
  .bat::before { content: ""; display: block; height: 100%; width: 78%; background: currentColor; border-radius: 1.5px; }
  .bat::after { content: ""; position: absolute; right: -3.5px; top: 3.5px; width: 2px; height: 4px; border-radius: 1px; background: currentColor; }
  .home-ind { position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%); width: 140px; height: 5px; border-radius: 3px; background: currentColor; opacity: .85; z-index: 20; }

  .scroll { position: absolute; inset: 0; padding: 54px 16px 120px; overflow: hidden; }
  .navbar { display: flex; justify-content: space-between; align-items: center; height: 44px; }
  .large { font-family: -apple-system, "SF Pro Display", Inter, sans-serif; font-weight: 700; font-size: 34px; letter-spacing: -0.02em; margin: 2px 4px 12px; }
  .gbtn { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; background: var(--glass); border: 1px solid var(--glass-stroke); backdrop-filter: blur(16px) saturate(1.8); box-shadow: 0 4px 16px -6px rgba(27,31,59,.25), inset 0 1px 0 rgba(255,255,255,.7); color: var(--text); }
  .screen.dark .gbtn { box-shadow: 0 4px 16px -6px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.12); }
  svg.i { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  svg.i.f { fill: currentColor; stroke: none; }
  .card { background: var(--card); border-radius: 26px; }
  .sec-t { font-size: 13px; color: var(--text-2); margin: 20px 16px 6px; }

  /* Tab bar (floating glass capsule) */
  .tabbar { position: absolute; left: 16px; right: 16px; bottom: 26px; height: 64px; border-radius: 32px; background: var(--glass); border: 1px solid var(--glass-stroke); backdrop-filter: blur(20px) saturate(1.8); box-shadow: 0 12px 30px -12px rgba(27,31,59,.35), inset 0 1px 0 rgba(255,255,255,.8); display: grid; grid-template-columns: repeat(4, 1fr); padding: 5px; z-index: 10; }
  .tab { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 10px; font-weight: 600; color: var(--text); border-radius: 27px; }
  .tab svg.i { width: 24px; height: 24px; }
  .tab.sel { background: rgba(232,87,126,.12); color: var(--tint); }
  .screen.dark .tabbar { box-shadow: 0 12px 30px -12px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.12); }
  .screen.dark .share { background: rgba(28,28,34,.92); }
  .screen.dark .acts, .screen.dark .people .ring { background: #2C2C34; }
  .screen.dark .people .badge { border-color: #1C1C22; }
  .screen.dark .alert { background: rgba(44,44,52,.88); color: #F4F5FA; }
  .screen.dark .alert p { color: #C3C6D8; }
  .screen.dark .alert .btns span { background: rgba(255,255,255,.1); }
  .screen.dark .fgrid .doc { background: #2C2C34; }
  .screen.dark .laptop { border-color: #6D7190; }
  .screen.dark .laptop::after { background: #6D7190; }

  /* Home */
  .pc { padding: 18px; position: relative; overflow: hidden; }
  .pc .glow { position: absolute; right: -60px; top: -80px; width: 240px; height: 240px; border-radius: 50%; background: radial-gradient(circle, rgba(232,87,126,.28), transparent 70%); }
  .pc-top { display: flex; gap: 14px; align-items: center; position: relative; }
  .laptop { width: 64px; height: 44px; border-radius: 6px; background: linear-gradient(160deg, #DCE6F5, #F3C8D6); border: 3px solid #2A2E48; position: relative; }
  .laptop::after { content: ""; position: absolute; left: -9px; right: -9px; bottom: -9px; height: 5px; border-radius: 0 0 5px 5px; background: #2A2E48; }
  .pc b { font-size: 19px; display: block; font-weight: 600; }
  .links { display: flex; gap: 6px; margin-top: 16px; position: relative; }
  .link { flex: 1; border-radius: 14px; background: var(--bg); padding: 8px 10px; font-size: 12px; color: var(--text-2); display: flex; align-items: center; gap: 6px; }
  .link .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--leaf); flex: none; }
  .link.off .dot { background: var(--text-3); }
  .qa { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
  .qa .tile { background: var(--card); border-radius: 22px; padding: 14px; height: 92px; display: flex; flex-direction: column; justify-content: space-between; font-weight: 600; font-size: 15px; }
  .qa .tile small { display: block; font-weight: 400; color: var(--text-2); font-size: 12px; margin-top: 1px; }
  .qa .ic { width: 34px; height: 34px; border-radius: 11px; display: grid; place-items: center; color: #fff; }
  .qa .ic svg.i { width: 19px; height: 19px; }
  .row { display: flex; align-items: center; gap: 12px; padding: 11px 16px; min-height: 52px; }
  .row + .row { box-shadow: inset 52px 1px 0 var(--card), inset 0 1px 0 var(--sep); }
  .row .ft { width: 36px; height: 36px; border-radius: 9px; display: grid; place-items: center; color: #fff; font-size: 9px; font-weight: 700; flex: none; }
  .row .tx { flex: 1; min-width: 0; }
  .row .tx b { font-weight: 500; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .tx small { color: var(--text-2); font-size: 13px; }
  .chev { color: var(--text-3); }

  /* Pairing scanner */
  .cam-bg { position: absolute; inset: 0; background: radial-gradient(400px 300px at 50% 46%, #4A4F6A 0%, #1E2035 60%, #0B0C16 100%); }
  .monitor { position: absolute; left: 50%; top: 280px; transform: translateX(-50%) rotate(-3deg); width: 300px; height: 200px; border-radius: 10px; background: #F3F4FA; box-shadow: 0 0 0 8px #1A1C2C; filter: blur(.4px); display: grid; place-items: center; }
  .mini-qr { width: 110px; height: 110px; background: repeating-conic-gradient(#1B1F3B 0 25%, #fff 0 50%) 0 0 / 14px 14px; border: 8px solid #fff; outline: 1px solid #ddd; }
  .finder { position: absolute; left: 50%; top: 262px; transform: translateX(-50%); width: 230px; height: 230px; }
  .finder i { position: absolute; width: 46px; height: 46px; border: 5px solid #fff; border-radius: 4px; }
  .finder i:nth-child(1) { left: 0; top: 0; border-right: 0; border-bottom: 0; border-top-left-radius: 22px; }
  .finder i:nth-child(2) { right: 0; top: 0; border-left: 0; border-bottom: 0; border-top-right-radius: 22px; }
  .finder i:nth-child(3) { left: 0; bottom: 0; border-right: 0; border-top: 0; border-bottom-left-radius: 22px; }
  .finder i:nth-child(4) { right: 0; bottom: 0; border-left: 0; border-top: 0; border-bottom-right-radius: 22px; }
  .sheet { position: absolute; left: 8px; right: 8px; bottom: 8px; border-radius: 44px; padding: 26px 24px 30px; background: var(--glass); border: 1px solid var(--glass-stroke); backdrop-filter: blur(30px) saturate(1.6); }
  .sheet h3 { margin: 0 0 6px; font-size: 22px; font-family: -apple-system, "SF Pro Display", Inter, sans-serif; }
  .sheet p { margin: 0; color: var(--text-2); }
  .pill-btn { height: 52px; border-radius: 26px; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 17px; margin-top: 18px; }
  .pill-btn.primary { background: var(--bloom); color: #fff; }
  .pill-btn.ghost { background: rgba(255,255,255,.12); color: inherit; margin-top: 8px; }

  /* System alert */
  .dim { position: absolute; inset: 0; background: rgba(0,0,0,.28); z-index: 12; }
  .alert { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 300px; border-radius: 34px; background: rgba(250,250,252,.82); backdrop-filter: blur(30px) saturate(1.8); text-align: center; z-index: 13; padding: 22px 18px 14px; box-shadow: 0 30px 60px -20px rgba(0,0,0,.4); }
  .alert b { font-size: 17px; display: block; margin-bottom: 6px; }
  .alert p { margin: 0 0 16px; font-size: 13px; color: #3C3F55; }
  .alert { color: #1B1F3B; }
  .alert .btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .alert .btns span { height: 46px; border-radius: 23px; display: grid; place-items: center; font-weight: 600; background: rgba(27,31,59,.07); }
  .alert .btns span.ok { background: #0A84FF; color: #fff; }

  /* Share sheet */
  .photo-full { position: absolute; inset: 0; background: radial-gradient(300px 240px at 30% 30%, #F3C8D6, transparent 70%), radial-gradient(300px 300px at 70% 60%, #4E54C8, transparent 70%), linear-gradient(170deg, #DCE6F5, #2F8F6B); }
  .share { position: absolute; left: 8px; right: 8px; bottom: 8px; top: 300px; border-radius: 44px; background: rgba(246,247,251,.9); backdrop-filter: blur(30px) saturate(1.6); padding: 18px 16px; z-index: 5; }
  .share .head { display: flex; gap: 12px; align-items: center; padding: 0 4px 14px; }
  .share .head .thumb { width: 50px; height: 50px; border-radius: 10px; background: linear-gradient(135deg, #F3C8D6, #4E54C8); }
  .share .head b { display: block; }
  .apps { display: flex; gap: 16px; padding: 10px 4px 14px; overflow: hidden; }
  .apps div { display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 11px; width: 64px; text-align: center; }
  .apps .ai { width: 64px; height: 64px; border-radius: 15px; overflow: hidden; }
  .people { display: flex; gap: 14px; padding: 4px 4px 14px; border-bottom: 1px solid var(--sep); }
  .people div { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; width: 64px; text-align: center; position: relative; }
  .people .ring { width: 64px; height: 64px; border-radius: 50%; display: grid; place-items: center; background: #fff; border: 1px solid var(--sep); }
  .people .badge { position: absolute; right: 2px; top: 44px; width: 22px; height: 22px; border-radius: 6px; overflow: hidden; border: 2px solid #F6F7FB; }
  .acts { background: #fff; border-radius: 16px; margin-top: 14px; }
  .acts div { display: flex; justify-content: space-between; align-items: center; padding: 13px 16px; }
  .acts div + div { border-top: 1px solid var(--sep); }

  /* Lock screen */
  .lock-bg { position: absolute; inset: 0; background: radial-gradient(500px 400px at 20% 10%, #E8577E 0%, transparent 60%), radial-gradient(500px 500px at 90% 80%, #4E54C8 0%, transparent 60%), linear-gradient(180deg, #2B2F5A, #12142A); }
  .lock-date { position: absolute; top: 78px; left: 0; right: 0; text-align: center; color: rgba(255,255,255,.9); font-weight: 600; font-size: 19px; }
  .lock-time { position: absolute; top: 98px; left: 0; right: 0; text-align: center; color: #fff; font-family: -apple-system, "SF Pro Display", Inter, sans-serif; font-size: 104px; font-weight: 700; letter-spacing: -0.03em; line-height: 1.05; }
  .widgets { position: absolute; top: 232px; left: 0; right: 0; display: flex; justify-content: center; gap: 10px; }
  .w-circ { width: 68px; height: 68px; border-radius: 50%; background: rgba(255,255,255,.18); backdrop-filter: blur(10px); color: #fff; display: grid; place-items: center; text-align: center; font-size: 11px; line-height: 1.1; }
  .w-circ b { font-size: 17px; display: block; }
  .w-rect { width: 150px; height: 68px; border-radius: 20px; background: rgba(255,255,255,.18); backdrop-filter: blur(10px); color: #fff; padding: 10px 12px; font-size: 12px; line-height: 1.3; }
  .live { position: absolute; left: 12px; right: 12px; bottom: 120px; border-radius: 26px; background: rgba(20,22,40,.6); backdrop-filter: blur(24px); color: #fff; padding: 16px 18px; }
  .live .top { display: flex; align-items: center; gap: 10px; }
  .live .bar { height: 6px; border-radius: 3px; background: rgba(255,255,255,.2); margin: 12px 0 6px; overflow: hidden; }
  .live .bar i { display: block; height: 100%; width: 64%; background: #FF86A6; border-radius: 3px; }
  .lock-btns { position: absolute; bottom: 44px; left: 46px; right: 46px; display: flex; justify-content: space-between; }
  .lock-btns span { width: 50px; height: 50px; border-radius: 50%; background: rgba(255,255,255,.18); backdrop-filter: blur(10px); display: grid; place-items: center; color: #fff; }
  .di.expanded { width: 190px; display: flex; align-items: center; justify-content: space-between; padding: 0 12px 0 8px; }
  .di .pie { width: 22px; height: 22px; border-radius: 50%; background: conic-gradient(#FF86A6 0 64%, rgba(255,255,255,.2) 0); }

  /* Control Center */
  .cc-bg { position: absolute; inset: 0; background: radial-gradient(500px 400px at 20% 10%, #E8577E 0%, transparent 60%), radial-gradient(500px 500px at 90% 80%, #4E54C8 0%, transparent 60%), linear-gradient(180deg, #2B2F5A, #12142A); filter: blur(18px) brightness(.55); transform: scale(1.1); }
  .cc { position: absolute; top: 76px; left: 24px; right: 24px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; color: #fff; }
  .cc .m { aspect-ratio: 1; border-radius: 50%; background: rgba(255,255,255,.16); display: grid; place-items: center; }
  .cc .m.on { background: #fff; color: #1B1F3B; }
  .cc .m.blue { background: #0A84FF; }
  .cc .w2 { grid-column: span 2; grid-row: span 2; border-radius: 34px; background: rgba(255,255,255,.16); padding: 16px; display: flex; flex-direction: column; justify-content: space-between; }
  .cc .w2h { grid-column: span 2; border-radius: 40px; background: rgba(255,255,255,.16); display: flex; align-items: center; gap: 10px; padding: 0 14px; font-size: 13px; font-weight: 600; line-height: 1.2; }
  .cc .w2h .m { width: 46px; flex: none; }
  .cc .w2h.fenpo .m { background: var(--bloom); color: #fff; }
  .cc .slider { grid-row: span 2; border-radius: 34px; background: rgba(255,255,255,.16); position: relative; overflow: hidden; }
  .cc .slider i { position: absolute; left: 0; right: 0; bottom: 0; height: 58%; background: #fff; }
  .cc-note { position: absolute; left: 24px; right: 24px; bottom: 60px; color: rgba(255,255,255,.75); font-size: 13px; text-align: center; }

  /* Webcam mode */
  .cam-live { position: absolute; inset: 0; background: radial-gradient(90px 104px at 50% 40%, #C9A08E 0 98%, transparent 100%), radial-gradient(240px 160px at 50% 92%, #4E54C8 0 98%, transparent 100%), radial-gradient(400px 260px at 75% 20%, #F3C8D6 0%, transparent 70%), linear-gradient(180deg, #DCE6F5, #9AA5C4); }
  .cam-top { position: absolute; top: 64px; left: 16px; right: 16px; display: flex; justify-content: space-between; z-index: 3; }
  .gl-pill { height: 36px; border-radius: 18px; padding: 0 14px; display: flex; align-items: center; gap: 8px; background: rgba(20,22,40,.45); backdrop-filter: blur(20px); color: #fff; font-size: 14px; font-weight: 600; }
  .gl-pill i.rec { width: 8px; height: 8px; border-radius: 50%; background: #FF4D6A; }
  .cam-bottom { position: absolute; left: 12px; right: 12px; bottom: 30px; border-radius: 34px; padding: 14px; background: rgba(20,22,40,.5); backdrop-filter: blur(24px); color: #fff; }
  .lens { display: flex; justify-content: center; gap: 8px; margin-bottom: 12px; }
  .lens span { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; font-size: 13px; font-weight: 600; background: rgba(255,255,255,.12); }
  .lens span.sel { background: rgba(255,255,255,.9); color: #1B1F3B; }
  .cam-row { display: flex; gap: 8px; }
  .cam-row div { flex: 1; height: 50px; border-radius: 25px; background: rgba(255,255,255,.12); display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 13px; font-weight: 600; }
  .cam-row div.on { background: var(--bloom); }

  /* Files app */
  .files-search { height: 40px; border-radius: 20px; background: rgba(118,118,128,.12); display: flex; align-items: center; gap: 6px; padding: 0 12px; color: var(--text-2); margin: 0 4px 16px; }
  .fgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px 10px; padding: 4px; }
  .fgrid div { text-align: center; font-size: 12px; }
  .fgrid .fold { width: 80px; height: 64px; margin: 0 auto 6px; position: relative; }
  .fgrid .fold::before { content: ""; position: absolute; left: 0; top: 0; width: 36px; height: 14px; border-radius: 6px 6px 0 0; background: #5AA9F7; }
  .fgrid .fold::after { content: ""; position: absolute; left: 0; right: 0; top: 8px; bottom: 0; border-radius: 6px 8px 8px 8px; background: linear-gradient(180deg, #7CC0FF, #4A9EF0); }
  .fgrid .doc { width: 54px; height: 66px; margin: 0 auto 4px; border-radius: 6px; background: #fff; border: 1px solid var(--sep); position: relative; display: grid; place-items: end center; padding-bottom: 8px; font-size: 9px; font-weight: 700; color: #fff; }
  .fgrid .doc span { padding: 1px 5px; border-radius: 3px; }
  .fgrid small { color: var(--text-2); display: block; font-size: 11px; }

  /* Settings */
  .group { background: var(--card); border-radius: 26px; overflow: hidden; }
  .srow { display: flex; align-items: center; gap: 12px; padding: 0 16px; min-height: 50px; }
  .srow + .srow { box-shadow: inset 58px 1px 0 var(--card), inset 0 1px 0 var(--sep); }
  .srow .si { width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; color: #fff; flex: none; }
  .srow .si svg.i { width: 18px; height: 18px; }
  .srow .lb { flex: 1; }
  .srow .val { color: var(--text-2); font-size: 15px; }
  .sw { width: 64px; height: 28px; border-radius: 14px; background: rgba(120,120,128,.2); position: relative; flex: none; cursor: pointer; }
  .sw::after { content: ""; position: absolute; top: 2px; left: 2px; width: 38px; height: 24px; border-radius: 12px; background: #fff; box-shadow: 0 2px 4px rgba(0,0,0,.18); transition: left .2s; }
  .sw.on { background: #34C759; }
  .sw.on::after { left: 24px; }
  .warn { margin: 10px 4px 0; padding: 12px 14px; border-radius: 18px; background: rgba(232,87,126,.1); font-size: 13px; color: var(--text); display: flex; gap: 10px; }

<script>
  // Light screens switch with the theme; lock screen, Control Center, scanner and camera stay dark.
  const themeBtn = document.getElementById("themeBtn");
  let dark = false;
  function applyTheme() {
    document.querySelectorAll(".screen:not([data-fixed])").forEach(sc => sc.classList.toggle("dark", dark));
    themeBtn.textContent = dark ? "Açık temayı göster" : "Koyu temayı göster";
    document.documentElement.dataset.theme = dark ? "dark" : "light";
  }
  themeBtn.addEventListener("click", () => { dark = !dark; applyTheme(); });
  if (matchMedia("(prefers-color-scheme: dark)").matches) { dark = true; applyTheme(); }
  document.querySelectorAll(".sw").forEach(s => s.addEventListener("click", () => s.classList.toggle("on")));
</script>
