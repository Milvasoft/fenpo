name: iOS

on:
  push:
    branches: [ios, main]
    paths:
      - "ios/**"
      - "protocol/**"
      - ".github/workflows/ios.yml"
  pull_request:
    paths:
      - "ios/**"
      - "protocol/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:
    inputs:
      testflight:
        description: "Upload a Release build to TestFlight after the tests pass"
        type: boolean
        default: false
      store_screenshots:
        description: "Only build the App Store assets (design/store: screenshots, creative assets, app preview)"
        type: boolean
        default: false
      without:
        description: "TestFlight without these extension targets (e.g. FenpoFiles FenpoBroadcast), while their App IDs are not registered"
        type: string
        default: ""
      symbolicate:
        description: "Only symbolicate: crash offsets in the Fenpo image (e.g. 0x1C60B0 0x1A2B3C)"
        type: string
        default: ""
      symbolicate_ref:
        description: "Commit of the crashed build, for symbolicate"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}-${{ inputs.symbolicate != '' && 'symbolicate' || (inputs.store_screenshots && 'store' || 'build') }}
  cancel-in-progress: true

env:
  PROTOC_VERSION: "31.1"

jobs:
  # The platform independent part of FenpoKit must keep building with the Swift toolchain on Windows.
  core-windows:
    name: FenpoKit core (Windows)
    if: inputs.symbolicate == '' && !inputs.store_screenshots
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - uses: compnerd/gha-setup-swift@main
        with:
          swift-version: swift-6.4.1-release
          swift-build: 6.4.1-RELEASE

      - name: Install protoc
        run: |
          curl -sSLo protoc.zip "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/protoc-${PROTOC_VERSION}-win64.zip"
          mkdir -p "$RUNNER_TEMP/protoc"
          unzip -q protoc.zip -d "$RUNNER_TEMP/protoc"
          echo "$RUNNER_TEMP/protoc/bin" >> "$GITHUB_PATH"

      - name: Generate protocol code
        run: ios/scripts/generate-proto.sh

      - name: Test
        run: swift test --package-path ios/FenpoKit

  app-macos:
    name: App and FenpoKit (iOS Simulator)
    if: inputs.symbolicate == '' && !inputs.store_screenshots
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5

      - name: Select newest Xcode
        run: |
          xcode="$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          sudo xcode-select -s "$xcode"
          xcodebuild -version
          swift --version

      - name: Install tools
        run: brew install xcodegen protobuf

      - name: Generate protocol code
        run: ios/scripts/generate-proto.sh

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Pick simulator
        run: echo "SIMULATOR_ID=$(ios/scripts/simulator-id.sh)" >> "$GITHUB_ENV"

      - name: Test FenpoKit
        working-directory: ios/FenpoKit
        run: |
          log="$RUNNER_TEMP/fenpokit-test.log"
          xcodebuild test \
            -scheme FenpoKit-Package \
            -destination "id=$SIMULATOR_ID" \
            -skipPackagePluginValidation \
            > "$log" 2>&1 || { grep -E "error:|failed|✘" "$log"; tail -60 "$log"; exit 1; }
          grep -E "✔|✘|Test run|\*\* TEST" "$log" | tail -40

      - name: Build test peripheral (macOS tool)
        run: swift build --package-path ios/Tools/FenpoTestPeripheral 2>&1 | grep -E "error:|warning:|Compiling|Build complete" | tail -20; test "${PIPESTATUS[0]}" -eq 0

      - name: Build app
        working-directory: ios
        run: |
          log="$RUNNER_TEMP/app-build.log"
          xcodebuild build \
            -project Fenpo.xcodeproj \
            -scheme Fenpo \
            -destination "id=$SIMULATOR_ID" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            > "$log" 2>&1 || { grep -E "error:" "$log"; tail -60 "$log"; exit 1; }
          grep -E "warning:" "$log" | sort -u | head -40 || true
          tail -3 "$log"

      - name: Build Release for devices (what TestFlight gets)
        working-directory: ios
        run: |
          log="$RUNNER_TEMP/release-build.log"
          xcodebuild build \
            -project Fenpo.xcodeproj \
            -scheme Fenpo \
            -configuration Release \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO \
            > "$log" 2>&1 || { grep -E "error:" "$log"; tail -60 "$log"; exit 1; }
          tail -3 "$log"

      - name: Test app (keychain and TLS)
        working-directory: ios
        run: |
          log="$RUNNER_TEMP/app-test.log"
          # Signed to run locally so the simulator applies the keychain entitlements.
          xcodebuild test \
            -project Fenpo.xcodeproj \
            -scheme Fenpo \
            -destination "id=$SIMULATOR_ID" \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM= \
            > "$log" 2>&1 || { grep -E "error:|failed|✘" "$log"; tail -60 "$log"; exit 1; }
          grep -E "✔|✘|Test run|\*\* TEST" "$log" | tail -20

      - name: Screenshots
        run: ios/scripts/screenshots.sh "$SIMULATOR_ID" "$RUNNER_TEMP/DerivedData/Build/Products/Debug-iphonesimulator/Fenpo.app" "$RUNNER_TEMP/screenshots"

      - name: Upload screenshots
        uses: actions/upload-artifact@v5
        with:
          name: screenshots
          path: ${{ runner.temp }}/screenshots
          if-no-files-found: error

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: xcodebuild-logs
          path: ${{ runner.temp }}/*.log
          if-no-files-found: ignore

  # Signs with the App Store Connect API key (automatic signing, cloud managed certificates) and
  # uploads to TestFlight. Only when started by hand with "testflight" checked.
  testflight:
    name: Upload to TestFlight
    needs: [core-windows, app-macos]
    if: github.event_name == 'workflow_dispatch' && inputs.testflight
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5

      - name: Select newest Xcode
        run: |
          xcode="$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          sudo xcode-select -s "$xcode"
          xcodebuild -version

      - name: Install tools
        run: brew install xcodegen protobuf

      - name: Generate protocol code and project
        run: |
          ios/scripts/generate-proto.sh
          (cd ios && xcodegen generate)

      - name: Leave out extensions
        if: inputs.without != ''
        env:
          WITHOUT: ${{ inputs.without }}
        run: |
          for target in $WITHOUT; do
            sed -i '' "/^      - target: ${target}\$/d" ios/project.yml
            echo "Left out $target"
          done
          (cd ios && xcodegen generate)

      - name: Write the API key
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          key="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          ( umask 077 && printf '%s\n' "$ASC_KEY_P8" > "$key" )
          echo "ASC_KEY_PATH=$key" >> "$GITHUB_ENV"

      - name: Archive
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          log="$RUNNER_TEMP/archive.log"
          xcodebuild archive \
            -project ios/Fenpo.xcodeproj \
            -scheme Fenpo \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/Fenpo.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            > "$log" 2>&1 || { grep -E "error:|Signing|Provisioning|certificate" "$log" | sort -u | head -40; tail -40 "$log"; exit 1; }
          tail -3 "$log"

      # Crash reports from this build can be symbolicated later with these.
      - name: Keep the dSYMs
        uses: actions/upload-artifact@v5
        with:
          name: dSYMs-${{ github.run_number }}
          path: ${{ runner.temp }}/Fenpo.xcarchive/dSYMs
          retention-days: 90

      - name: Upload
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          log="$RUNNER_TEMP/upload.log"
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Fenpo.xcarchive" \
            -exportOptionsPlist ios/Config/ExportOptions.plist \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            > "$log" 2>&1 || { grep -E "error:|ITMS|Upload" "$log" | sort -u | head -40; tail -40 "$log"; exit 1; }
          grep -E "Upload succeeded|EXPORT SUCCEEDED|Uploaded" "$log" | tail -5
          echo "Uploaded Fenpo $(grep -m1 MARKETING_VERSION ios/Config/Base.xcconfig | cut -d= -f2 | tr -d ' ') (${{ github.run_number }}) from ${GITHUB_SHA::7}" >> "$GITHUB_STEP_SUMMARY"

      # Every run creates a development certificate on its fresh runner; revoke it so the team
      # does not reach Apple's certificate limit.
      - name: Revoke this run's development certificate
        if: always()
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          python3 -m pip install --quiet --break-system-packages pyjwt cryptography
          python3 ios/scripts/revoke-run-certificates.py

      - name: Delete the API key
        if: always()
        run: rm -f "$RUNNER_TEMP"/AuthKey_*.p8

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: testflight-logs
          path: |
            ${{ runner.temp }}/archive.log
            ${{ runner.temp }}/upload.log
          if-no-files-found: ignore

  # Names the functions at crash offsets of a TestFlight build made before its dSYMs were kept:
  # rebuilds that commit the way the TestFlight job does (Release, newest Xcode, unsigned, which
  # leaves the code where it was) and looks the offsets up with atos.
  symbolicate:
    name: Symbolicate
    if: github.event_name == 'workflow_dispatch' && inputs.symbolicate != ''
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.symbolicate_ref || github.sha }}

      - name: Select newest Xcode
        run: |
          xcode="$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          sudo xcode-select -s "$xcode"
          xcodebuild -version

      - name: Install tools
        run: brew install xcodegen protobuf

      - name: Generate protocol code and project
        run: |
          ios/scripts/generate-proto.sh
          (cd ios && xcodegen generate)

      - name: Archive
        run: |
          log="$RUNNER_TEMP/archive.log"
          xcodebuild archive \
            -project ios/Fenpo.xcodeproj \
            -scheme Fenpo \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/Fenpo.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            > "$log" 2>&1 || { grep -E "error:" "$log" | sort -u | head -40; tail -40 "$log"; exit 1; }
          tail -3 "$log"

      - name: Look up
        env:
          OFFSETS: ${{ inputs.symbolicate }}
        run: |
          dwarf="$RUNNER_TEMP/Fenpo.xcarchive/dSYMs/Fenpo.app.dSYM/Contents/Resources/DWARF/Fenpo"
          # Compare with the crash report's Binary Images line for Fenpo: a different UUID means
          # the rebuild is not the same binary and the names below may be off.
          xcrun dwarfdump --uuid "$dwarf" | tee -a "$GITHUB_STEP_SUMMARY"
          for offset in $OFFSETS; do
            address="$(printf '0x%x' $((0x100000000 + offset)))"
            echo "$offset atos: $(xcrun atos -arch arm64 -o "$dwarf" -l 0x100000000 "$address")"
            # The closest symbol at or below the address, for code atos cannot name (thunks,
            # outlined copies, closure contexts).
            nearest="$(xcrun nm -n --defined-only "$dwarf" | python3 -c 'import sys; a = int(sys.argv[1], 16); print(max((l for l in sys.stdin if l[:16].strip() and int(l[:16], 16) <= a), key=lambda l: int(l[:16], 16), default=""), end="")' "$address")"
            echo "$offset nearest: $(echo "$nearest" | xcrun swift-demangle --simplified)"
            xcrun dwarfdump --lookup "$address" "$dwarf" | grep -E "DW_AT_(linkage_)?name|Line info" | head -6
          done | tee -a "$GITHUB_STEP_SUMMARY"

  # Every App Store asset in design/store (README.md there): the screens and the demo tour from a
  # 6.9-inch simulator with the sample session's demo content, laid out by design/store/scripts/build.
  # Started by hand.
  store-screenshots:
    name: App Store assets
    if: github.event_name == 'workflow_dispatch' && inputs.store_screenshots
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5

      - name: Select newest Xcode
        run: |
          xcode="$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          sudo xcode-select -s "$xcode"
          xcodebuild -version

      - name: Install tools
        run: |
          brew install xcodegen protobuf ffmpeg
          python3 -m pip install --quiet --break-system-packages pillow

      - name: Generate protocol code and project
        run: |
          ios/scripts/generate-proto.sh
          (cd ios && xcodegen generate)

      - name: Pick a 6.9-inch simulator
        run: |
          id="$(bash ios/scripts/store-simulator-id.sh)"
          echo "Simulator $id"
          echo "SIMULATOR_ID=$id" >> "$GITHUB_ENV"

      - name: Build app
        working-directory: ios
        run: |
          log="$RUNNER_TEMP/app-build.log"
          xcodebuild build             -project Fenpo.xcodeproj             -scheme Fenpo             -destination "id=$SIMULATOR_ID"             -derivedDataPath "$RUNNER_TEMP/DerivedData"             CODE_SIGNING_ALLOWED=NO             > "$log" 2>&1 || { grep -E "error:" "$log"; tail -60 "$log"; exit 1; }
          tail -3 "$log"

      - name: Capture and build
        run: |
          status=0
          bash design/store/scripts/build --capture "$SIMULATOR_ID" "$RUNNER_TEMP/DerivedData/Build/Products/Debug-iphonesimulator/Fenpo.app" || status=$?
          cat design/store/CHECK.md >> "$GITHUB_STEP_SUMMARY" || true
          exit $status

      - name: Upload assets
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: app-store-assets
          path: |
            design/store/appstore
            design/store/raw
            design/store/recordings
            design/store/CHECK.md
          if-no-files-found: error
